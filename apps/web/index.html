<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Encuentra especialistas independientes, compara servicios y conecta con el perfil adecuado para tu proyecto." />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem("inventra-theme");
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const background = theme === "dark" ? "#111113" : "#ffffff";

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = background;
        document.querySelector('meta[name="theme-color"]').content = background;
      })();
    </script>
    <title>Inventra - Servicios</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
